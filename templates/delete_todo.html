
{% extends 'base.html' %}
{% block content %}
<div class="card p-4 shadow-sm">
    <p>Are you sure you want to delete <strong>"{{ todos.title }}"</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes</button>
        <a href="{% url 'todo_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
